name: Execució Diària de Correus

on:
  schedule:
    # S'executa cada dia de dilluns a divendres a les 07:00 UTC (08:00h hora d'aquí)
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # Permet executar-ho manualment si es vol

jobs:
  executar-script:
    runs-on: ubuntu-latest

    steps:
    - name: Descarregar codi del repositori
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instal·lar llibreries
      run: |
        python -m pip install --upgrade pip
        pip install pandas

    - name: Executar script d'enviament de correus
      env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python script_auto.py

    - name: Desar l'històric d'enviats actualitzat a GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add enviats_log.csv
        git commit -m "Actualització automàtica de l'històric d'enviats" || exit 0
        git push
